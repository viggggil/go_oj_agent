[project]
name = "oj-agent-service"
version = "0.1.0"
description = "Distributed OJ Agent service infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncmy>=0.2.10,<0.3",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "grpcio>=1.81.1,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.14,<1",
    "pydantic-settings>=2.8,<3",
    "pyjwt[crypto]>=2.10,<3",
    "protobuf>=6.33.5,<7",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.11,<1",
    "grpcio-tools>=1.81.1,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/grpcgen/**/*.py" = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["app.grpcgen.*", "grpc.*", "google.protobuf.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: needs a real oj_agent MySQL database"]
