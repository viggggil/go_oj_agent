syntax = "proto3";

package problem.conf;

option go_package = "github.com/viggggil/go_oj_agent/services/problem/internal/conf;conf";

message Bootstrap {
  ServiceProto service = 1;
  ServerProto server = 2;
  DataProto data = 3;
  StorageProto storage = 4;
  RegistryProto registry = 5;
}

message ServiceProto {
  string name = 1;
}

message ServerProto {
  GRPCProto grpc = 1;
}

message GRPCProto {
  string address = 1;
  int32 max_receive_message_bytes = 2;
}

message DataProto {
  string mysql_dsn = 1;
  string redis_addr = 2;
  string redis_password = 3;
  int32 redis_db = 4;
  string redis_namespace = 5;
}

message StorageProto {
  MinIOProto minio = 1;
}

message MinIOProto {
  string endpoint = 1;
  string access_key = 2;
  string secret_key = 3;
  string bucket = 4;
  bool use_ssl = 5;
}

message RegistryProto {
  ConsulProto consul = 1;
}

message ConsulProto {
  bool enabled = 1;
  string address = 2;
  string scheme = 3;
  string datacenter = 4;
  string token = 5;
  string service_id = 6;
}
