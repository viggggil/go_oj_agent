syntax = "proto3";

package judge.conf;

option go_package = "github.com/viggggil/go_oj_agent/services/judge/internal/conf;conf";

message Bootstrap {
  ServiceProto service = 1;
  ServerProto server = 2;
  DataProto data = 3;
  StorageProto storage = 4;
  MessagingProto messaging = 5;
  RegistryProto registry = 6;
  InternalAuthProto internal_auth = 7;
}

message ServiceProto {
  string name = 1;
}

message ServerProto {
  GRPCProto grpc = 1;
}

message GRPCProto {
  string address = 1;
}

message DataProto {
  string mysql_dsn = 1;
  string redis_addr = 2;
  string redis_password = 3;
  int32 redis_db = 4;
  string redis_namespace = 5;
}

message StorageProto {
  MinIOProto minio = 1;
}

message MinIOProto {
  string endpoint = 1;
  string access_key = 2;
  string secret_key = 3;
  string source_bucket = 4;
  string problem_bucket = 5;
  bool use_ssl = 6;
}

message MessagingProto {
  RabbitMQProto rabbitmq = 1;
}

message RabbitMQProto {
  string url = 1;
  string exchange = 2;
  string result_queue = 3;
  string dead_letter_queue = 4;
  int32 max_retries = 5;
  string retry_delay = 6;
}

message RegistryProto {
  ConsulProto consul = 1;
}

message ConsulProto {
  bool enabled = 1;
  string address = 2;
  string scheme = 3;
  string datacenter = 4;
  string token = 5;
  string service_id = 6;
}

message InternalAuthProto {
  string public_key_file = 1;
  string key_id = 2;
  string issuer = 3;
  string audience = 4;
  string subject = 5;
  string max_token_ttl = 6;
  string clock_skew = 7;
}
