service:
  name: contest-service
messaging:
  url: "amqp://judge:judge-password@127.0.0.1:5672/"
  exchange: oj.events
  queue: contest.submission-judged
  dead_letter_queue: contest.results.dlq
  prefetch: 16
server:
  grpc:
    address: ":9005"
    max_receive_message_bytes: 35651584
data:
  mysql_dsn: "root:local-root-password@tcp(127.0.0.1:3306)/oj_contest?parseTime=true"
registry:
  consul:
    enabled: false
    address: "127.0.0.1:8500"
    scheme: "http"
    datacenter: ""
    token: ""
    service_id: ""
internal_auth:
  public_key_file: ""
  key_id: "contest-internal-2026-09"
  issuer: "go-oj-contest"
  audience: "contest-service"
  subject: ""
  max_token_ttl: "30s"
  clock_skew: "5s"
judge:
  name: "judge-service"
  endpoint: "127.0.0.1:9003"
  timeout: "3s"
  private_key_file: ""
  key_id: "contest-internal-2026-09"
  issuer: "go-oj-contest"
  audience: "judge-service"
  subject: "contest-service"
  token_ttl: "30s"

problem:
  name: "problem-service"
  endpoint: "127.0.0.1:9002"
  timeout: "3s"
  private_key_file: ""
  key_id: "contest-internal-2026-09"
  issuer: "go-oj-contest"
  audience: "problem-service"
  subject: "contest-service"
  token_ttl: "30s"

leaderboard_cache:
  enabled: true
  addresses: ["127.0.0.1:6379"]
  password: ""
  db: 0
  namespace: "oj:contest"
  timeout: "2s"
