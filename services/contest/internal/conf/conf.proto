syntax = "proto3";

package contest.conf;

option go_package = "github.com/viggggil/go_oj_agent/services/contest/internal/conf;conf";

message Bootstrap {
  ServiceProto service = 1;
  ServerProto server = 2;
  DataProto data = 3;
  RegistryProto registry = 4;
  InternalAuthProto internal_auth = 5;
  ClientProto judge = 6;
  MessagingProto messaging = 7;
  ClientProto problem = 8;
}

message MessagingProto {
  string url = 1;
  string exchange = 2;
  string queue = 3;
  string dead_letter_queue = 4;
  int32 prefetch = 5;
}

message ServiceProto {
  string name = 1;
}

message ServerProto {
  GRPCProto grpc = 1;
}

message GRPCProto {
  string address = 1;
  int32 max_receive_message_bytes = 2;
}

message DataProto {
  string mysql_dsn = 1;
}

message RegistryProto {
  ConsulProto consul = 1;
}

message ConsulProto {
  bool enabled = 1;
  string address = 2;
  string scheme = 3;
  string datacenter = 4;
  string token = 5;
  string service_id = 6;
}

message InternalAuthProto {
  string public_key_file = 1;
  string key_id = 2;
  string issuer = 3;
  string audience = 4;
  string subject = 5;
  string max_token_ttl = 6;
  string clock_skew = 7;
  repeated InternalCallerProto additional_callers = 8;
}

message InternalCallerProto {
  string public_key_file = 1;
  string key_id = 2;
  string issuer = 3;
  string subject = 4;
}

message ClientProto {
  string name = 1;
  string endpoint = 2;
  string timeout = 3;
  string private_key_file = 4;
  string key_id = 5;
  string issuer = 6;
  string audience = 7;
  string subject = 8;
  string token_ttl = 9;
}
