syntax = "proto3";

package user.v1;

option go_package = "github.com/viggggil/go_oj_agent/api/user/v1;userv1";

import "errors/errors.proto";

// UserErrorReason 定义 user-service 对外稳定的业务错误原因。
enum UserErrorReason {
  USER_ERROR_REASON_UNSPECIFIED = 0;
  USER_ERROR_REASON_INVALID_ARGUMENT = 1 [(errors.code) = 400];
  USER_ERROR_REASON_INVALID_CREDENTIAL = 2 [(errors.code) = 401];
  USER_ERROR_REASON_ALREADY_EXISTS = 3 [(errors.code) = 409];
  USER_ERROR_REASON_NOT_FOUND = 4 [(errors.code) = 404];
  USER_ERROR_REASON_ADMIN_ALREADY_EXISTS = 5 [(errors.code) = 409];
  USER_ERROR_REASON_INACTIVE = 6 [(errors.code) = 403];
  USER_ERROR_REASON_PERMISSION_DENIED = 7 [(errors.code) = 403];
  USER_ERROR_REASON_REFRESH_TOKEN_DENIED = 8 [(errors.code) = 401];
}
