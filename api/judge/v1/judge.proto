syntax = "proto3";

package judge.v1;

option go_package = "github.com/viggggil/go_oj_agent/api/judge/v1;judgev1";

import "validate/validate.proto";

service JudgeAdminService {
  rpc GetWorkerStatus(GetWorkerStatusRequest) returns (GetWorkerStatusResponse);
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_IDLE = 1;
  WORKER_STATUS_BUSY = 2;
  WORKER_STATUS_DRAINING = 3;
  WORKER_STATUS_OFFLINE = 4;
}

enum JudgeVerdict {
  JUDGE_VERDICT_UNSPECIFIED = 0;
  JUDGE_VERDICT_AC = 1;
  JUDGE_VERDICT_WA = 2;
  JUDGE_VERDICT_TLE = 3;
  JUDGE_VERDICT_MLE = 4;
  JUDGE_VERDICT_RE = 5;
  JUDGE_VERDICT_CE = 6;
}

// Legacy protobuf model. RabbitMQ contracts live in pkg/mq and must not be
// used by new producers or consumers.
message JudgeCaseResult {
  int32 case_no = 1;
  JudgeVerdict verdict = 2;
  int32 time_ms = 3;
  int32 memory_kb = 4;
  string message = 5;
}

// Legacy protobuf model. RabbitMQ contracts live in pkg/mq.
message JudgeResult {
  int64 submission_id = 1 [(validate.rules).int64.gt = 0];
  JudgeVerdict verdict = 2 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  int32 time_ms = 3 [(validate.rules).int32.gte = 0];
  int32 memory_kb = 4 [(validate.rules).int32.gte = 0];
  repeated JudgeCaseResult case_results = 5;
  string judge_revision = 6 [(validate.rules).string.len = 26];
  string event_id = 7 [(validate.rules).string.uuid = true];
}

// Legacy protobuf model. The canonical RabbitMQ JudgeTask lives in pkg/mq.
message JudgeTask {
  string event_id = 1 [(validate.rules).string.uuid = true];
  int64 submission_id = 2 [(validate.rules).int64.gt = 0];
  int64 problem_id = 3 [(validate.rules).int64.gt = 0];
  string language = 4 [(validate.rules).string = {min_len: 1, max_len: 32}];
  string judge_revision = 5 [(validate.rules).string.len = 26];
  string source_object_key = 6 [(validate.rules).string = {min_len: 1, max_len: 512}];
  string source_sha256 = 7 [(validate.rules).string = {pattern: "^[a-f0-9]{64}$"}];
  int64 source_size_bytes = 8 [(validate.rules).int64.gt = 0];
}

// Legacy protobuf model. The canonical RabbitMQ JudgeFailed lives in pkg/mq.
message JudgeFailure {
  string event_id = 1 [(validate.rules).string.uuid = true];
  int64 submission_id = 2 [(validate.rules).int64.gt = 0];
  string judge_revision = 3 [(validate.rules).string.len = 26];
  string reason = 4 [(validate.rules).string = {min_len: 1, max_len: 128}];
  bool retryable = 5;
}

message GetWorkerStatusRequest {
  string worker_id = 1;
}

message GetWorkerStatusResponse {
  string worker_id = 1;
  WorkerStatus status = 2;
  repeated string supported_languages = 3;
  int32 running_tasks = 4;
}
