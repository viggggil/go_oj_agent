syntax = "proto3";

package problem.v1;

option go_package = "github.com/viggggil/go_oj_agent/api/problem/v1;problemv1";

import "api/common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

service ProblemService {
  rpc CreateProblem(CreateProblemRequest) returns (CreateProblemResponse);
  rpc UpdateProblem(UpdateProblemRequest) returns (UpdateProblemResponse);
  rpc ArchiveProblem(ArchiveProblemRequest) returns (ArchiveProblemResponse);
  rpc GetProblem(GetProblemRequest) returns (GetProblemResponse);
  rpc ListProblems(ListProblemsRequest) returns (ListProblemsResponse);

  // AddTestcase stores one paired .in/.out testcase and its metadata atomically
  // from the caller's perspective.
  rpc AddTestcase(AddTestcaseRequest) returns (AddTestcaseResponse);
  rpc ArchiveTestcase(ArchiveTestcaseRequest) returns (ArchiveTestcaseResponse);
  // Shared by the admin UI and trusted judge callers.
  rpc ListProblemTestcases(ListProblemTestcasesRequest) returns (ListProblemTestcasesResponse);
}

enum ProblemDifficulty {
  PROBLEM_DIFFICULTY_UNSPECIFIED = 0;
  PROBLEM_DIFFICULTY_EASY = 1;
  PROBLEM_DIFFICULTY_MEDIUM = 2;
  PROBLEM_DIFFICULTY_HARD = 3;
}

enum ProblemStatus {
  PROBLEM_STATUS_UNSPECIFIED = 0;
  PROBLEM_STATUS_NORMAL = 1;
  PROBLEM_STATUS_ARCHIVED = 2;
}

enum TestcaseStatus {
  TESTCASE_STATUS_UNSPECIFIED = 0;
  TESTCASE_STATUS_ACTIVE = 1;
  TESTCASE_STATUS_ARCHIVED = 2;
}

// ProblemSummary deliberately excludes the statement and testcase metadata.
message ProblemSummary {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  ProblemDifficulty difficulty = 4;
  ProblemStatus status = 5;
}

message Problem {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  ProblemDifficulty difficulty = 5;
  int32 time_limit_ms = 6;
  int32 memory_limit_kb = 7;
  ProblemStatus status = 8;
  int64 created_by = 9;
  repeated Tag tags = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message Tag {
  int64 id = 1;
  string name = 2;
}

// TestcaseMetadata contains object references, never testcase file contents.
message TestcaseMetadata {
  int64 id = 1;
  int64 problem_id = 2;
  reserved 3;
  reserved "version";
  int32 case_no = 4;
  string input_object_key = 5;
  string output_object_key = 6;
  string input_sha256 = 7;
  string output_sha256 = 8;
  int64 input_size_bytes = 9;
  int64 output_size_bytes = 10;
  TestcaseStatus status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp archived_at = 13;
}

message ProblemInput {
  string title = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string slug = 2 [(validate.rules).string = {
    min_len: 1,
    max_len: 255,
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  }];
  string description = 3 [(validate.rules).string = {min_len: 1, max_len: 100000}];
  ProblemDifficulty difficulty = 4 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  int32 time_limit_ms = 5 [(validate.rules).int32 = {gt: 0, lte: 600000}];
  int32 memory_limit_kb = 6 [(validate.rules).int32 = {gt: 0, lte: 1048576}];
  repeated string tags = 7 [(validate.rules).repeated = {
    unique: true,
    max_items: 20,
    items: {string: {min_len: 1, max_len: 64}}
  }];
}

message CreateProblemRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  ProblemInput problem = 2 [(validate.rules).message.required = true];
  // Optional paired testcases submitted together by the admin create page.
  repeated TestcaseInput testcases = 3 [(validate.rules).repeated = {max_items: 100}];
}

message CreateProblemResponse {
  Problem problem = 1;
}

message UpdateProblemRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  int64 problem_id = 2 [(validate.rules).int64.gt = 0];
  ProblemInput problem = 3 [(validate.rules).message.required = true];
}

message UpdateProblemResponse {
  Problem problem = 1;
}

message ArchiveProblemRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  int64 problem_id = 2 [(validate.rules).int64.gt = 0];
}

message ArchiveProblemResponse {
  Problem problem = 1;
}

message GetProblemRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  int64 problem_id = 2 [(validate.rules).int64.gt = 0];
}

message GetProblemResponse {
  Problem problem = 1;
}

message ListProblemsRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  common.v1.PageRequest page = 2 [(validate.rules).message.required = true];
}

message ListProblemsResponse {
  repeated ProblemSummary items = 1;
  common.v1.PageResponse page = 2;
}

message AddTestcaseRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  int64 problem_id = 2 [(validate.rules).int64.gt = 0];
  int32 case_no = 3 [(validate.rules).int32.gt = 0];
  string input_filename = 4 [(validate.rules).string = {
    min_len: 4,
    max_len: 255,
    pattern: "^[^/\\\\]+\\.in$"
  }];
  bytes input_content = 5 [(validate.rules).bytes = {min_len: 1, max_len: 16777216}];
  string output_filename = 6 [(validate.rules).string = {
    min_len: 5,
    max_len: 255,
    pattern: "^[^/\\\\]+\\.out$"
  }];
  bytes output_content = 7 [(validate.rules).bytes = {min_len: 1, max_len: 16777216}];
}

message TestcaseInput {
  int32 case_no = 1 [(validate.rules).int32.gt = 0];
  string input_filename = 2 [(validate.rules).string = {
    min_len: 4, max_len: 255, pattern: "^[^/\\\\]+\\.in$"
  }];
  bytes input_content = 3 [(validate.rules).bytes = {min_len: 1, max_len: 16777216}];
  string output_filename = 4 [(validate.rules).string = {
    min_len: 5, max_len: 255, pattern: "^[^/\\\\]+\\.out$"
  }];
  bytes output_content = 5 [(validate.rules).bytes = {min_len: 1, max_len: 16777216}];
}

message AddTestcaseResponse {
  TestcaseMetadata testcase = 1;
}

message ArchiveTestcaseRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  int64 problem_id = 2 [(validate.rules).int64.gt = 0];
  int64 testcase_id = 3 [(validate.rules).int64.gt = 0];
}

message ArchiveTestcaseResponse {
  TestcaseMetadata testcase = 1;
}

message ListProblemTestcasesRequest {
  common.v1.RequestContext context = 1 [(validate.rules).message.required = true];
  int64 problem_id = 2 [(validate.rules).int64.gt = 0];
  bool include_archived = 3;
}

message ListProblemTestcasesResponse {
  repeated TestcaseMetadata items = 1;
}
