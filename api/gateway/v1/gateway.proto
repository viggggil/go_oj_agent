syntax = "proto3";

package gateway.v1;

option go_package = "github.com/viggggil/go_oj_agent/api/gateway/v1;gatewayv1";

import "google/api/annotations.proto";
import "validate/validate.proto";
import "api/common/v1/common.proto";
import "api/problem/v1/problem.proto";
import "api/submission/v1/submission.proto";

service GatewayService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/healthz"
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
    };
  }

  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{id}"
    };
  }

  rpc CreateProblem(CreateProblemRequest) returns (CreateProblemResponse) { option (google.api.http) = { post: "/api/v1/problems" body: "*" }; }
  rpc GetProblem(GetProblemRequest) returns (GetProblemResponse) { option (google.api.http) = { get: "/api/v1/problems/{problem_id}" }; }
  rpc ListProblems(ListProblemsRequest) returns (ListProblemsResponse) { option (google.api.http) = { get: "/api/v1/problems" }; }
  rpc UpdateProblem(UpdateProblemRequest) returns (UpdateProblemResponse) { option (google.api.http) = { put: "/api/v1/problems/{problem_id}" body: "problem" }; }
  rpc ArchiveProblem(ArchiveProblemRequest) returns (ArchiveProblemResponse) { option (google.api.http) = { delete: "/api/v1/problems/{problem_id}" }; }
  rpc AddTestcase(AddTestcaseRequest) returns (AddTestcaseResponse) { option (google.api.http) = { post: "/api/v1/problems/{problem_id}/testcases" body: "*" }; }
  rpc ListProblemTestcases(ListProblemTestcasesRequest) returns (ListProblemTestcasesResponse) { option (google.api.http) = { get: "/api/v1/problems/{problem_id}/testcases" }; }
  rpc ArchiveTestcase(ArchiveTestcaseRequest) returns (ArchiveTestcaseResponse) { option (google.api.http) = { delete: "/api/v1/problems/{problem_id}/testcases/{testcase_id}" }; }

  rpc CreateSubmission(CreateSubmissionRequest) returns (CreateSubmissionResponse) { option (google.api.http) = { post: "/api/v1/submissions" body: "*" }; }
  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse) { option (google.api.http) = { get: "/api/v1/submissions/{submission_id}" }; }
  rpc GetJudgeResult(GetJudgeResultRequest) returns (GetJudgeResultResponse) { option (google.api.http) = { get: "/api/v1/submissions/{submission_id}/result" }; }
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse) { option (google.api.http) = { get: "/api/v1/submissions" }; }
  rpc RejudgeSubmission(RejudgeSubmissionRequest) returns (RejudgeSubmissionResponse) { option (google.api.http) = { post: "/api/v1/submissions/{submission_id}/rejudge" body: "*" }; }
}

message UserSummary {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string status = 4;
  repeated string roles = 5;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message RegisterRequest {
  string username = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
  string email = 2 [(validate.rules).string = {email: true, max_len: 255}];
  string password = 3 [(validate.rules).string = {min_len: 8, max_bytes: 72}];
}

message RegisterResponse {
  UserSummary user = 1;
}

message LoginRequest {
  string account = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string password = 2 [(validate.rules).string = {min_len: 1, max_bytes: 72}];
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];
}

message LogoutResponse {
  string status = 1;
}

message GetCurrentUserRequest {}

message GetUserRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0];
}

message GetCurrentUserResponse {
  UserSummary user = 1;
}

message GetUserResponse {
  UserSummary user = 1;
}

message CreateProblemRequest {
  problem.v1.ProblemInput problem = 1 [(validate.rules).message.required = true];
  repeated problem.v1.TestcaseInput testcases = 2 [(validate.rules).repeated = {max_items: 100}];
}
message CreateProblemResponse { problem.v1.Problem problem = 1; }
message GetProblemRequest { int64 problem_id = 1 [(validate.rules).int64.gt = 0]; }
message GetProblemResponse { problem.v1.Problem problem = 1; }
message ListProblemsRequest { common.v1.PageRequest page = 1 [(validate.rules).message.required = true]; }
message ListProblemsResponse { repeated problem.v1.ProblemSummary items = 1; common.v1.PageResponse page = 2; }
message UpdateProblemRequest { int64 problem_id = 1 [(validate.rules).int64.gt = 0]; problem.v1.ProblemInput problem = 2 [(validate.rules).message.required = true]; }
message UpdateProblemResponse { problem.v1.Problem problem = 1; }
message ArchiveProblemRequest { int64 problem_id = 1 [(validate.rules).int64.gt = 0]; }
message ArchiveProblemResponse { problem.v1.Problem problem = 1; }
message AddTestcaseRequest {
  int64 problem_id = 1 [(validate.rules).int64.gt = 0];
  int32 case_no = 2 [(validate.rules).int32.gt = 0];
  string input_filename = 3 [(validate.rules).string = {min_len: 4, max_len: 255, pattern: "^[1-9][0-9]*\\.in$"}];
  bytes input_content = 4 [(validate.rules).bytes = {min_len: 1, max_len: 16777216}];
  string output_filename = 5 [(validate.rules).string = {min_len: 5, max_len: 255, pattern: "^[1-9][0-9]*\\.out$"}];
  bytes output_content = 6 [(validate.rules).bytes = {min_len: 1, max_len: 16777216}];
}
message AddTestcaseResponse { problem.v1.TestcaseMetadata testcase = 1; }
message ListProblemTestcasesRequest { int64 problem_id = 1 [(validate.rules).int64.gt = 0]; bool include_archived = 2; }
message ListProblemTestcasesResponse { repeated problem.v1.TestcaseMetadata items = 1; }
message ArchiveTestcaseRequest { int64 problem_id = 1 [(validate.rules).int64.gt = 0]; int64 testcase_id = 2 [(validate.rules).int64.gt = 0]; }
message ArchiveTestcaseResponse { problem.v1.TestcaseMetadata testcase = 1; }

message CreateSubmissionRequest {
  int64 problem_id = 1 [(validate.rules).int64.gt = 0];
  string language = 2 [(validate.rules).string = {min_len: 1, max_len: 32, pattern: "^[a-z][a-z0-9_+-]*$"}];
  string source_code = 3 [(validate.rules).string = {min_len: 1, max_bytes: 1048576}];
  string idempotency_key = 4 [(validate.rules).string.uuid = true];
}
message CreateSubmissionResponse { int64 submission_id = 1; submission.v1.SubmissionStatus status = 2; }
message GetSubmissionRequest { int64 submission_id = 1 [(validate.rules).int64.gt = 0]; }
message GetSubmissionResponse { submission.v1.Submission submission = 1; }
message GetJudgeResultRequest { int64 submission_id = 1 [(validate.rules).int64.gt = 0]; }
message GetJudgeResultResponse { submission.v1.JudgeResult result = 1; }
message ListSubmissionsRequest { common.v1.PageRequest page = 1 [(validate.rules).message.required = true]; int64 problem_id = 2; submission.v1.SubmissionStatus status = 3; string language = 4; int64 user_id = 5; }
message ListSubmissionsResponse { repeated submission.v1.Submission items = 1; common.v1.PageResponse page = 2; }
message RejudgeSubmissionRequest { int64 submission_id = 1 [(validate.rules).int64.gt = 0]; string idempotency_key = 2 [(validate.rules).string.uuid = true]; }
message RejudgeSubmissionResponse { int64 invalidated_submission_id = 1; submission.v1.Submission submission = 2; }
