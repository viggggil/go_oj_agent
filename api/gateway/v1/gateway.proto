syntax = "proto3";

package gateway.v1;

option go_package = "github.com/viggggil/go_oj_agent/api/gateway/v1;gatewayv1";

import "validate/validate.proto";

message APIResponse {
  string request_id = 1;
}

message APIError {
  string code = 1;
  string message = 2;
  string request_id = 3;
}

message UserSummary {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string status = 4;
  repeated string roles = 5;
}

message RegisterHTTPRequest {
  string username = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
  string email = 2 [(validate.rules).string = {email: true, max_len: 255}];
  string password = 3 [(validate.rules).string = {min_len: 8, max_bytes: 72}];
}

message RegisterHTTPResponse {
  UserSummary user = 1;
}

message LoginHTTPRequest {
  string account = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string password = 2 [(validate.rules).string = {min_len: 1, max_bytes: 72}];
}

message TokenHTTPResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RefreshTokenHTTPRequest {
  string refresh_token = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];
}

message GetCurrentUserHTTPResponse {
  UserSummary user = 1;
}

message GetUserHTTPResponse {
  UserSummary user = 1;
}
