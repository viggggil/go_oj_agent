syntax = "proto3";

package gateway.v1;

option go_package = "github.com/viggggil/go_oj_agent/api/gateway/v1;gatewayv1";

import "google/api/annotations.proto";
import "validate/validate.proto";
import "api/common/v1/common.proto";
import "api/problem/v1/problem.proto";

service GatewayService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/healthz"
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
    };
  }

  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{id}"
    };
  }

  rpc CreateProblem(problem.v1.CreateProblemRequest) returns (problem.v1.CreateProblemResponse) { option (google.api.http) = { post: "/api/v1/problems" body: "*" }; }
  rpc GetProblem(problem.v1.GetProblemRequest) returns (problem.v1.GetProblemResponse) { option (google.api.http) = { get: "/api/v1/problems/{problem_id}" }; }
  rpc ListProblems(problem.v1.ListProblemsRequest) returns (problem.v1.ListProblemsResponse) { option (google.api.http) = { get: "/api/v1/problems" }; }
  rpc UpdateProblem(problem.v1.UpdateProblemRequest) returns (problem.v1.UpdateProblemResponse) { option (google.api.http) = { put: "/api/v1/problems/{problem_id}" body: "problem" }; }
  rpc ArchiveProblem(problem.v1.ArchiveProblemRequest) returns (problem.v1.ArchiveProblemResponse) { option (google.api.http) = { delete: "/api/v1/problems/{problem_id}" }; }
  rpc AddTestcase(problem.v1.AddTestcaseRequest) returns (problem.v1.AddTestcaseResponse) { option (google.api.http) = { post: "/api/v1/problems/{problem_id}/testcases" body: "*" }; }
  rpc ListProblemTestcases(problem.v1.ListProblemTestcasesRequest) returns (problem.v1.ListProblemTestcasesResponse) { option (google.api.http) = { get: "/api/v1/problems/{problem_id}/testcases" }; }
  rpc ArchiveTestcase(problem.v1.ArchiveTestcaseRequest) returns (problem.v1.ArchiveTestcaseResponse) { option (google.api.http) = { delete: "/api/v1/problems/{problem_id}/testcases/{testcase_id}" }; }
}

message UserSummary {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string status = 4;
  repeated string roles = 5;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message RegisterRequest {
  string username = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
  string email = 2 [(validate.rules).string = {email: true, max_len: 255}];
  string password = 3 [(validate.rules).string = {min_len: 8, max_bytes: 72}];
}

message RegisterResponse {
  UserSummary user = 1;
}

message LoginRequest {
  string account = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string password = 2 [(validate.rules).string = {min_len: 1, max_bytes: 72}];
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];
}

message LogoutResponse {
  string status = 1;
}

message GetCurrentUserRequest {}

message GetUserRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0];
}

message GetCurrentUserResponse {
  UserSummary user = 1;
}

message GetUserResponse {
  UserSummary user = 1;
}
