name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0
          github_token: ${{ github.token }}

      - name: Proto lint
        run: make proto

      - name: Go format check
        run: make fmt-check

      - name: Go vet
        run: make vet

      - name: Go unit test
        run: make test-unit

      - name: Go build
        run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Format check
        working-directory: web
        run: npm run format:check
      - name: Build
        working-directory: web
        run: npm run build

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check 'uv==0.12.23'
      - name: Install locked Agent dependencies
        run: uv sync --directory agent --frozen
      - name: Check Agent source
        run: make agent-check UV=uv
      - name: Run Agent unit tests
        run: make agent-test-unit UV=uv
      - name: Run Agent Docker integration tests
        run: make agent-test-integration UV=uv

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Docker integration tests
        run: make test-integration
