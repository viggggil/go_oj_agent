name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0

      - name: Proto lint
        run: make proto

      - name: Go format check
        run: make fmt-check

      - name: Go vet
        run: make vet

      - name: Go unit test
        run: make test-unit

      - name: Go build
        run: make build
