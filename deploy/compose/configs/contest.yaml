service:
  name: contest-service
messaging:
  url: "amqp://judge:judge-password@rabbitmq:5672/"
  exchange: oj.events
  queue: contest.submission-judged
  dead_letter_queue: contest.results.dlq
  prefetch: 16
server:
  metrics_address: ":9105"
  grpc:
    address: ":9005"
    max_receive_message_bytes: 35651584
data:
  mysql_dsn: "root:local-root-password@tcp(mysql:3306)/oj_contest?parseTime=true"
registry:
  consul:
    enabled: false
internal_auth:
  public_key_file: "/run/auth-keys/gateway-public.pem"
  key_id: "gateway-internal-2026-09"
  issuer: "go-oj-gateway"
  audience: "contest-service"
  subject: "gateway-service"
  max_token_ttl: "60s"
  clock_skew: "5s"
judge:
  name: judge-service
  endpoint: "judge-service:9003"
  timeout: "3s"
  private_key_file: "/run/auth-keys/gateway-private.pem"
  key_id: "gateway-internal-2026-09"
  issuer: "go-oj-gateway"
  audience: "judge-service"
  subject: "gateway-service"
  token_ttl: "30s"

problem:
  name: problem-service
  endpoint: "problem-service:9002"
  timeout: "3s"
  private_key_file: "/run/auth-keys/gateway-private.pem"
  key_id: "gateway-internal-2026-09"
  issuer: "go-oj-gateway"
  audience: "problem-service"
  subject: "gateway-service"
  token_ttl: "30s"

leaderboard_cache:
  enabled: true
  addresses: ["redis:6379"]
  password: ""
  db: 0
  namespace: "oj:contest"
  timeout: "2s"
