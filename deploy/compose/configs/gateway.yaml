service:
  name: gateway-service
server:
  http:
    address: "${SERVER_HTTP_ADDRESS}"
    timeout: "30s"
auth:
  access_token_key: "${AUTH_ACCESS_TOKEN_KEY}"
  access_token_public_key_file: "${AUTH_ACCESS_TOKEN_PUBLIC_KEY_FILE}"
  access_token_key_id: "${AUTH_ACCESS_TOKEN_KEY_ID}"
  issuer: "${AUTH_ISSUER}"
  audience: "${AUTH_AUDIENCE}"
  internal_private_key_file: "${AUTH_INTERNAL_PRIVATE_KEY_FILE}"
  internal_key_id: "${AUTH_INTERNAL_KEY_ID}"
  internal_issuer: "${AUTH_INTERNAL_ISSUER}"
  internal_audience: "${AUTH_INTERNAL_AUDIENCE}"
  internal_token_ttl: "${AUTH_INTERNAL_TOKEN_TTL}"
clients:
  agent:
    enabled: false
    endpoint: "${CLIENTS_AGENT_ENDPOINT}"
    connect_timeout: "3s"
    response_header_timeout: "5s"
    max_duration: "120s"
    idle_timeout: "20s"
    write_timeout: "5s"
    max_concurrent: 8
    max_request_bytes: 262144
    max_frame_bytes: 262144
  user:
    name: user-service
    endpoint: "${CLIENTS_USER_ENDPOINT}"
    timeout: "3s"
  problem:
    name: problem-service
    endpoint: "${CLIENTS_PROBLEM_ENDPOINT}"
    timeout: "30s"
  submission:
    name: judge-service
    endpoint: "${CLIENTS_SUBMISSION_ENDPOINT}"
    timeout: "3s"
  contest:
    name: contest-service
    endpoint: "contest-service:9005"
    timeout: "3s"
registry:
  consul:
    enabled: false
