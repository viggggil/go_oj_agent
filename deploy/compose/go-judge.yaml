name: go-oj-go-judge

services:
  go-judge:
    build:
      context: ../..
      dockerfile: deploy/go-judge/Dockerfile
    privileged: true
    shm_size: 256m
    command:
      - -enable-grpc
      - -grpc-addr
      - :5051
      - -http-addr
      - 127.0.0.1:5050
      - -auth-token
      - ${GO_JUDGE_AUTH_TOKEN:-local-development-go-judge-token}
      - -mount-conf
      - /opt/mount.yaml
      - -parallelism
      - "2"
      - -copy-out-limit
      - 1m
      - -output-limit
      - 1m
    ports:
      - "127.0.0.1:${GO_JUDGE_GRPC_PORT:-15051}:5051"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
