name: go-oj-agent

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: oj_user
      MYSQL_USER: ${MYSQL_USER:-oj_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-user-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../migrations/mysql/000001_create_schemas.up.sql:/docker-entrypoint-initdb.d/001_create_schemas.sql:ro
      - ../../migrations/user/000001_create_users.up.sql:/docker-entrypoint-initdb.d/101_create_users.sql:ro
      - ../../migrations/user/000002_create_roles.up.sql:/docker-entrypoint-initdb.d/102_create_roles.sql:ro
      - ../../migrations/user/000003_create_user_roles.up.sql:/docker-entrypoint-initdb.d/103_create_user_roles.sql:ro
      - ../../migrations/user/000004_seed_default_roles.up.sql:/docker-entrypoint-initdb.d/104_seed_default_roles.sql:ro
      - ../../migrations/problem/000001_create_problems.up.sql:/docker-entrypoint-initdb.d/201_create_problems.sql:ro
      - ../../migrations/problem/000002_create_tags.up.sql:/docker-entrypoint-initdb.d/202_create_tags.sql:ro
      - ../../migrations/problem/000003_create_problem_tags.up.sql:/docker-entrypoint-initdb.d/203_create_problem_tags.sql:ro
      - ../../migrations/problem/000004_create_testcases.up.sql:/docker-entrypoint-initdb.d/204_create_testcases.sql:ro
      - ../../migrations/submission/000001_create_submissions.up.sql:/docker-entrypoint-initdb.d/301_create_submissions.sql:ro
      - ../../migrations/submission/000002_create_submission_case_results.up.sql:/docker-entrypoint-initdb.d/302_create_submission_case_results.sql:ro
      - ../../migrations/submission/000003_create_outbox_events.up.sql:/docker-entrypoint-initdb.d/303_create_outbox_events.sql:ro
      - ../../migrations/submission/000004_create_processed_events.up.sql:/docker-entrypoint-initdb.d/304_create_processed_events.sql:ro
      - ../../migrations/submission/000005_create_idempotency_requests.up.sql:/docker-entrypoint-initdb.d/305_create_idempotency_requests.sql:ro
      - ../../migrations/submission/000006_align_submissions_with_judge_contract.up.sql:/docker-entrypoint-initdb.d/306_align_submissions_with_judge_contract.sql:ro
      - ../../migrations/submission/000007_add_outbox_leasing.up.sql:/docker-entrypoint-initdb.d/307_add_outbox_leasing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/problem-data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  auth-key-init:
    image: alpine:3.23
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        apk add --no-cache openssl >/dev/null &&
        test -f /keys/user-private.pem || openssl genrsa -out /keys/user-private.pem 2048 >/dev/null 2>&1 &&
        test -f /keys/user-public.pem || openssl rsa -in /keys/user-private.pem -pubout -out /keys/user-public.pem >/dev/null 2>&1 &&
        test -f /keys/gateway-private.pem || openssl genrsa -out /keys/gateway-private.pem 2048 >/dev/null 2>&1 &&
        test -f /keys/gateway-public.pem || openssl rsa -in /keys/gateway-private.pem -pubout -out /keys/gateway-public.pem >/dev/null 2>&1 &&
        chmod 644 /keys/*.pem
    volumes:
      - auth-keys:/keys
    restart: "no"

  user-service:
    build:
      context: ../..
      dockerfile: services/user/Dockerfile
    environment:
      KRATOS_SERVER_GRPC_ADDRESS: ":9001"
      KRATOS_DATA_MYSQL_DSN: "${MYSQL_USER:-oj_user}:${MYSQL_PASSWORD:-local-user-password}@tcp(mysql:3306)/oj_user?parseTime=true"
      KRATOS_DATA_REDIS_ADDR: "redis:6379"
      KRATOS_DATA_REDIS_PASSWORD: ""
      KRATOS_DATA_REDIS_DB: "0"
      KRATOS_DATA_REDIS_NAMESPACE: "go_oj_agent:user"
      KRATOS_AUTH_ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      KRATOS_AUTH_REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-168h}"
      KRATOS_AUTH_ACCESS_TOKEN_KEY: "${AUTH_ACCESS_TOKEN_KEY:-local-development-access-token-key-change-before-sharing}"
      KRATOS_AUTH_ACCESS_TOKEN_PRIVATE_KEY_FILE: "/run/auth-keys/user-private.pem"
      KRATOS_AUTH_ACCESS_TOKEN_KEY_ID: "user-access-2026-09"
      KRATOS_AUTH_ISSUER: "go-oj-agent"
      KRATOS_AUTH_AUDIENCE: "go-oj-gateway"
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
    ports:
      - "127.0.0.1:${USER_GRPC_PORT:-9001}:9001"
    volumes:
      - ./configs/user.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-key-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9001"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  problem-service:
    build:
      context: ../..
      dockerfile: services/problem/Dockerfile
    environment:
      KRATOS_SERVER_GRPC_ADDRESS: ":9002"
      KRATOS_SERVER_GRPC_MAX_RECEIVE_MESSAGE_BYTES: "35651584"
      KRATOS_DATA_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-local-root-password}@tcp(mysql:3306)/oj_problem?parseTime=true"
      KRATOS_DATA_REDIS_ADDR: "redis:6379"
      KRATOS_DATA_REDIS_PASSWORD: ""
      KRATOS_DATA_REDIS_DB: "0"
      KRATOS_DATA_REDIS_NAMESPACE: "go_oj_agent:problem"
      KRATOS_STORAGE_MINIO_ENDPOINT: "minio:9000"
      KRATOS_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      KRATOS_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      KRATOS_STORAGE_MINIO_BUCKET: "problem-data"
      KRATOS_STORAGE_MINIO_USE_SSL: "false"
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
    ports:
      - "127.0.0.1:${PROBLEM_GRPC_PORT:-9002}:9002"
    volumes:
      - ./configs/problem.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      auth-key-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9002"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  gateway-service:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    environment:
      KRATOS_SERVER_HTTP_ADDRESS: ":8080"
      KRATOS_AUTH_ACCESS_TOKEN_KEY: "${AUTH_ACCESS_TOKEN_KEY:-local-development-access-token-key-change-before-sharing}"
      KRATOS_AUTH_ISSUER: "go-oj-agent"
      KRATOS_AUTH_AUDIENCE: "go-oj-gateway"
      KRATOS_AUTH_ACCESS_TOKEN_PUBLIC_KEY_FILE: "/run/auth-keys/user-public.pem"
      KRATOS_AUTH_ACCESS_TOKEN_KEY_ID: "user-access-2026-09"
      KRATOS_AUTH_INTERNAL_PRIVATE_KEY_FILE: "/run/auth-keys/gateway-private.pem"
      KRATOS_AUTH_INTERNAL_KEY_ID: "gateway-internal-2026-09"
      KRATOS_AUTH_INTERNAL_ISSUER: "go-oj-gateway"
      KRATOS_AUTH_INTERNAL_AUDIENCE: "problem-service"
      KRATOS_AUTH_INTERNAL_TOKEN_TTL: "30s"
      KRATOS_CLIENTS_USER_ENDPOINT: "user-service:9001"
      KRATOS_CLIENTS_PROBLEM_ENDPOINT: "problem-service:9002"
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080"
    volumes:
      - ./configs/gateway.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      user-service:
        condition: service_healthy
      problem-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: "${WEB_API_BASE_URL:-}"
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-5173}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:
  auth-keys:
