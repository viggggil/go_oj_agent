name: go-oj-agent

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: oj_user
      MYSQL_USER: ${MYSQL_USER:-oj_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-user-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../migrations/mysql/000001_create_schemas.up.sql:/docker-entrypoint-initdb.d/001_create_schemas.sql:ro
      - ../../migrations/user/000001_create_users.up.sql:/docker-entrypoint-initdb.d/101_create_users.sql:ro
      - ../../migrations/user/000002_create_roles.up.sql:/docker-entrypoint-initdb.d/102_create_roles.sql:ro
      - ../../migrations/user/000003_create_user_roles.up.sql:/docker-entrypoint-initdb.d/103_create_user_roles.sql:ro
      - ../../migrations/user/000004_seed_default_roles.up.sql:/docker-entrypoint-initdb.d/104_seed_default_roles.sql:ro
      - ../../migrations/problem/000001_create_problems.up.sql:/docker-entrypoint-initdb.d/201_create_problems.sql:ro
      - ../../migrations/problem/000002_create_tags.up.sql:/docker-entrypoint-initdb.d/202_create_tags.sql:ro
      - ../../migrations/problem/000003_create_problem_tags.up.sql:/docker-entrypoint-initdb.d/203_create_problem_tags.sql:ro
      - ../../migrations/problem/000004_create_testcases.up.sql:/docker-entrypoint-initdb.d/204_create_testcases.sql:ro
      - ../../migrations/problem/000005_add_active_judge_revision.up.sql:/docker-entrypoint-initdb.d/205_add_active_judge_revision.sql:ro
      - ../../migrations/submission/000001_create_submissions.up.sql:/docker-entrypoint-initdb.d/301_create_submissions.sql:ro
      - ../../migrations/submission/000002_create_submission_case_results.up.sql:/docker-entrypoint-initdb.d/302_create_submission_case_results.sql:ro
      - ../../migrations/submission/000003_create_outbox_events.up.sql:/docker-entrypoint-initdb.d/303_create_outbox_events.sql:ro
      - ../../migrations/submission/000004_create_processed_events.up.sql:/docker-entrypoint-initdb.d/304_create_processed_events.sql:ro
      - ../../migrations/submission/000005_create_idempotency_requests.up.sql:/docker-entrypoint-initdb.d/305_create_idempotency_requests.sql:ro
      - ../../migrations/submission/000006_align_submissions_with_judge_contract.up.sql:/docker-entrypoint-initdb.d/306_align_submissions_with_judge_contract.sql:ro
      - ../../migrations/submission/000007_add_outbox_leasing.up.sql:/docker-entrypoint-initdb.d/307_add_outbox_leasing.sql:ro
      - ../../migrations/submission/000008_add_outbox_failure_reason.up.sql:/docker-entrypoint-initdb.d/308_add_outbox_failure_reason.sql:ro
      - ../../migrations/submission/000009_add_contest_id.up.sql:/docker-entrypoint-initdb.d/309_add_contest_id.sql:ro
      - ../../migrations/contest/000001_create_contests.up.sql:/docker-entrypoint-initdb.d/401_create_contests.sql:ro
      - ../../migrations/contest/000002_create_result_projection.up.sql:/docker-entrypoint-initdb.d/402_create_result_projection.sql:ro
      - ../../migrations/contest/000003_create_leaderboard_outbox.up.sql:/docker-entrypoint-initdb.d/403_create_leaderboard_outbox.sql:ro
      - ../../migrations/contest/000004_index_cache_lag.up.sql:/docker-entrypoint-initdb.d/404_index_cache_lag.sql:ro
      - ../../migrations/agent/000001_create_agent_runtime.up.sql:/docker-entrypoint-initdb.d/501_create_agent_runtime.sql:ro
      - ./agent-user.sql:/docker-entrypoint-initdb.d/502_create_agent_development_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: ../..
      dockerfile: deploy/compose/minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio-init:
    build:
      context: ../..
      dockerfile: deploy/compose/mc.Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/problem-data &&
        mc mb --ignore-existing local/submission-source
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-judge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-judge-password}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  go-judge:
    build:
      context: ../..
      dockerfile: deploy/go-judge/Dockerfile
    privileged: true
    cgroup: host
    shm_size: 256m
    command:
      - -enable-grpc
      - -grpc-addr
      - :5051
      - -http-addr
      - 127.0.0.1:5050
      - -auth-token
      - ${GO_JUDGE_AUTH_TOKEN:-local-development-go-judge-token}
      - -mount-conf
      - /opt/mount.yaml
      - -parallelism
      - "2"
      - -copy-out-limit
      - 64m
      - -output-limit
      - 64m
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  auth-key-init:
    image: alpine:3.23
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        apk add --no-cache openssl >/dev/null &&
        test -f /keys/user-private.pem || openssl genrsa -out /keys/user-private.pem 2048 >/dev/null 2>&1 &&
        test -f /keys/user-public.pem || openssl rsa -in /keys/user-private.pem -pubout -out /keys/user-public.pem >/dev/null 2>&1 &&
        test -f /keys/gateway-private.pem || openssl genrsa -out /keys/gateway-private.pem 2048 >/dev/null 2>&1 &&
        test -f /keys/gateway-public.pem || openssl rsa -in /keys/gateway-private.pem -pubout -out /keys/gateway-public.pem >/dev/null 2>&1 &&
        test -f /keys/judge-private.pem || openssl genrsa -out /keys/judge-private.pem 2048 >/dev/null 2>&1 &&
        test -f /keys/judge-public.pem || openssl rsa -in /keys/judge-private.pem -pubout -out /keys/judge-public.pem >/dev/null 2>&1 &&
        cp /keys/gateway-public.pem /agent-public/gateway-public.pem &&
        chmod 644 /agent-public/gateway-public.pem &&
        chmod 644 /keys/*.pem
    volumes:
      - auth-keys:/keys
      - agent-auth-public:/agent-public
    restart: "no"

  user-service:
    build:
      context: ../..
      dockerfile: services/user/Dockerfile
    environment:
      KRATOS_SERVER_GRPC_ADDRESS: ":9001"
      KRATOS_DATA_MYSQL_DSN: "${MYSQL_USER:-oj_user}:${MYSQL_PASSWORD:-local-user-password}@tcp(mysql:3306)/oj_user?parseTime=true"
      KRATOS_DATA_REDIS_ADDR: "redis:6379"
      KRATOS_DATA_REDIS_PASSWORD: ""
      KRATOS_DATA_REDIS_DB: "0"
      KRATOS_DATA_REDIS_NAMESPACE: "go_oj_agent:user"
      KRATOS_AUTH_ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      KRATOS_AUTH_REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-168h}"
      KRATOS_AUTH_ACCESS_TOKEN_KEY: "${AUTH_ACCESS_TOKEN_KEY:-local-development-access-token-key-change-before-sharing}"
      KRATOS_AUTH_ACCESS_TOKEN_PRIVATE_KEY_FILE: "/run/auth-keys/user-private.pem"
      KRATOS_AUTH_ACCESS_TOKEN_KEY_ID: "user-access-2026-09"
      KRATOS_AUTH_ISSUER: "go-oj-agent"
      KRATOS_AUTH_AUDIENCE: "go-oj-gateway"
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
    ports:
      - "127.0.0.1:${USER_GRPC_PORT:-9001}:9001"
    volumes:
      - ./configs/user.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-key-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9001"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  problem-service:
    build:
      context: ../..
      dockerfile: services/problem/Dockerfile
    environment:
      KRATOS_SERVER_GRPC_ADDRESS: ":9002"
      KRATOS_SERVER_GRPC_MAX_RECEIVE_MESSAGE_BYTES: "35651584"
      KRATOS_DATA_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-local-root-password}@tcp(mysql:3306)/oj_problem?parseTime=true"
      KRATOS_DATA_REDIS_ADDR: "redis:6379"
      KRATOS_DATA_REDIS_PASSWORD: ""
      KRATOS_DATA_REDIS_DB: "0"
      KRATOS_DATA_REDIS_NAMESPACE: "go_oj_agent:problem"
      KRATOS_STORAGE_MINIO_ENDPOINT: "minio:9000"
      KRATOS_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      KRATOS_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      KRATOS_STORAGE_MINIO_BUCKET: "problem-data"
      KRATOS_STORAGE_MINIO_USE_SSL: "false"
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
    ports:
      - "127.0.0.1:${PROBLEM_GRPC_PORT:-9002}:9002"
    volumes:
      - ./configs/problem.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      auth-key-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9002"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  judge-service:
    build:
      context: ../..
      dockerfile: services/judge/Dockerfile
    environment:
      KRATOS_SERVER_GRPC_ADDRESS: ":9003"
      KRATOS_DATA_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-local-root-password}@tcp(mysql:3306)/oj_submission?parseTime=true"
      KRATOS_STORAGE_MINIO_ENDPOINT: "minio:9000"
      KRATOS_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      KRATOS_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
      KRATOS_MESSAGING_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-judge}:${RABBITMQ_PASSWORD:-judge-password}@rabbitmq:5672/"
      KRATOS_MESSAGING_RABBITMQ_EXCHANGE: "oj.events"
      KRATOS_MESSAGING_RABBITMQ_RESULT_QUEUE: "judge.results"
      KRATOS_MESSAGING_RABBITMQ_DEAD_LETTER_QUEUE: "judge.dlq"
      KRATOS_MESSAGING_RABBITMQ_MAX_RETRIES: "3"
      KRATOS_MESSAGING_RABBITMQ_RETRY_DELAY: "5s"
    ports:
      - "127.0.0.1:${JUDGE_GRPC_PORT:-9004}:9003"
    volumes:
      - ./configs/judge.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      auth-key-init:
        condition: service_completed_successfully
      problem-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9003"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  contest-service:
    build:
      context: ../..
      dockerfile: services/contest/Dockerfile
    environment:
      KRATOS_SERVER_GRPC_ADDRESS: ":9005"
      KRATOS_SERVER_GRPC_MAX_RECEIVE_MESSAGE_BYTES: "35651584"
      KRATOS_DATA_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-local-root-password}@tcp(mysql:3306)/oj_contest?parseTime=true"
      KRATOS_MESSAGING_URL: "amqp://${RABBITMQ_USER:-judge}:${RABBITMQ_PASSWORD:-judge-password}@rabbitmq:5672/"
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
    ports:
      - "127.0.0.1:${CONTEST_GRPC_PORT:-9005}:9005"
    volumes:
      - ./configs/contest.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      judge-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9005"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  judge-worker:
    build:
      context: ../..
      dockerfile: services/judge-worker/Dockerfile
    environment:
      KRATOS_SANDBOX_GO_JUDGE_ENDPOINT: "go-judge:5051"
      KRATOS_SANDBOX_GO_JUDGE_TOKEN: "${GO_JUDGE_AUTH_TOKEN:-local-development-go-judge-token}"
      KRATOS_STORAGE_MINIO_ENDPOINT: "minio:9000"
      KRATOS_STORAGE_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      KRATOS_STORAGE_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      KRATOS_MESSAGING_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-judge}:${RABBITMQ_PASSWORD:-judge-password}@rabbitmq:5672/"
      KRATOS_MESSAGING_RABBITMQ_EXCHANGE: "oj.events"
      KRATOS_WORKER_CONCURRENCY: "2"
      KRATOS_WORKER_TASK_TIMEOUT: "60s"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      go-judge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  gateway-service:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    environment:
      KRATOS_SERVER_HTTP_ADDRESS: ":8080"
      KRATOS_AUTH_ACCESS_TOKEN_KEY: "${AUTH_ACCESS_TOKEN_KEY:-local-development-access-token-key-change-before-sharing}"
      KRATOS_AUTH_ISSUER: "go-oj-agent"
      KRATOS_AUTH_AUDIENCE: "go-oj-gateway"
      KRATOS_AUTH_ACCESS_TOKEN_PUBLIC_KEY_FILE: "/run/auth-keys/user-public.pem"
      KRATOS_AUTH_ACCESS_TOKEN_KEY_ID: "user-access-2026-09"
      KRATOS_AUTH_INTERNAL_PRIVATE_KEY_FILE: "/run/auth-keys/gateway-private.pem"
      KRATOS_AUTH_INTERNAL_KEY_ID: "gateway-internal-2026-09"
      KRATOS_AUTH_INTERNAL_ISSUER: "go-oj-gateway"
      KRATOS_AUTH_INTERNAL_AUDIENCE: "problem-service"
      KRATOS_AUTH_INTERNAL_TOKEN_TTL: "30s"
      KRATOS_CLIENTS_USER_ENDPOINT: "user-service:9001"
      KRATOS_CLIENTS_PROBLEM_ENDPOINT: "problem-service:9002"
      KRATOS_CLIENTS_SUBMISSION_ENDPOINT: "judge-service:9003"
      KRATOS_CLIENTS_AGENT_ENABLED: "${AGENT_ENABLED:-false}"
      KRATOS_CLIENTS_AGENT_ENDPOINT: "http://agent-service:8000"
      KRATOS_REGISTRY_CONSUL_ENABLED: "false"
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080"
    volumes:
      - ./configs/gateway.yaml:/app/config.yaml:ro
      - auth-keys:/run/auth-keys:ro
    depends_on:
      user-service:
        condition: service_healthy
      problem-service:
        condition: service_healthy
      contest-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  agent-service:
    profiles: ["agent"]
    build:
      context: ../../agent
      dockerfile: Dockerfile
    environment:
      AGENT_ENVIRONMENT: development
      AGENT_HOST: 0.0.0.0
      AGENT_CHAT_ENABLED: true
      AGENT_RUNTIME_MODE: langgraph_fake
      AGENT_DATABASE_URL: "${AGENT_DATABASE_URL:-mysql+asyncmy://oj_agent:local-agent-password@mysql:3306/oj_agent}"
      AGENT_GATEWAY_PUBLIC_KEY_FILE: /run/agent-auth/gateway-public.pem
      AGENT_GATEWAY_KEY_ID: gateway-internal-2026-09
      AGENT_MAX_RUN_SECONDS: 30
      AGENT_SSE_HEARTBEAT_SECONDS: 5
      AGENT_MAX_CONCURRENT_RUNS: 8
    volumes:
      - agent-auth-public:/run/agent-auth:ro
    depends_on:
      mysql:
        condition: service_healthy
      auth-key-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: "${WEB_API_BASE_URL:-}"
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-5173}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:
  auth-keys:
  agent-auth-public:
