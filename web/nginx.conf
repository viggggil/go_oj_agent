server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS can assign a new address when the gateway is
  # recreated. Resolve the service name at request time instead of keeping
  # the address that existed when nginx started.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway_upstream http://gateway-service:8080;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /healthz {
    proxy_pass $gateway_upstream;
  }
}
