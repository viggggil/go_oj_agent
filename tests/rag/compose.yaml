services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: oj_agent
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent-password
      MYSQL_ROOT_PASSWORD: root-password
    ports:
      - "127.0.0.1:${RAG_MYSQL_PORT}:3306"
    volumes:
      - ../../migrations/agent/000001_create_agent_runtime.up.sql:/docker-entrypoint-initdb.d/501_agent.sql:ro
      - ../../migrations/agent/000002_create_agent_configuration.up.sql:/docker-entrypoint-initdb.d/502_configuration.sql:ro
      - ../../migrations/agent/000003_create_model_provider.up.sql:/docker-entrypoint-initdb.d/503_provider.sql:ro
      - ../../migrations/agent/000004_create_knowledge.up.sql:/docker-entrypoint-initdb.d/504_knowledge.sql:ro
      - ../../migrations/agent/000005_create_eval.up.sql:/docker-entrypoint-initdb.d/505_eval.sql:ro
      - ../../migrations/agent/000006_create_eval_runs.up.sql:/docker-entrypoint-initdb.d/506_eval_runs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-password"]
      interval: 2s
      timeout: 3s
      retries: 40
  minio:
    build:
      context: ../..
      dockerfile: deploy/compose/minio.Dockerfile
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${RAG_MINIO_PORT}:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:${RAG_QDRANT_PORT}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *200* ]]'"]
      interval: 2s
      timeout: 3s
      retries: 30
  embedding:
    build:
      context: ../../agent/embedding
    ports:
      - "127.0.0.1:${RAG_EMBEDDING_PORT}:8001"
