services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: oj_agent
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent-password
      MYSQL_ROOT_PASSWORD: root-password
    ports:
      - "127.0.0.1:${AGENT_TEST_MYSQL_PORT}:3306"
    volumes:
      - ../../migrations/mysql/000001_create_schemas.up.sql:/docker-entrypoint-initdb.d/001_create_schemas.sql:ro
      - ../../migrations/agent/000001_create_agent_runtime.up.sql:/docker-entrypoint-initdb.d/501_create_agent_runtime.sql:ro
      - ../../migrations/agent/000002_create_agent_configuration.up.sql:/docker-entrypoint-initdb.d/502_create_agent_configuration.sql:ro
      - ../../migrations/agent/000003_create_model_provider.up.sql:/docker-entrypoint-initdb.d/503_create_model_provider.sql:ro
      - ../../migrations/agent/000004_create_knowledge.up.sql:/docker-entrypoint-initdb.d/504_create_knowledge.sql:ro
      - ../../migrations/agent/000005_create_eval.up.sql:/docker-entrypoint-initdb.d/505_create_eval_datasets.sql:ro
      - ../../migrations/agent/000006_create_eval_runs.up.sql:/docker-entrypoint-initdb.d/506_create_eval_runs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot-password"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    build:
      context: ../..
      dockerfile: deploy/compose/minio.Dockerfile
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${AGENT_TEST_MINIO_PORT}:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  agent-service:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    environment:
      AGENT_ENVIRONMENT: test
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8000
      AGENT_LOG_LEVEL: INFO
      AGENT_DATABASE_URL: mysql+asyncmy://agent:agent-password@mysql:3306/oj_agent
      AGENT_READINESS_TIMEOUT_SECONDS: 2
      AGENT_SHUTDOWN_TIMEOUT_SECONDS: 10
      AGENT_CHAT_ENABLED: true
      AGENT_ADMIN_ENABLED: true
      AGENT_EVAL_PRINCIPALS: '{"student_a":88501}'
      AGENT_RAG_MINIO_ENDPOINT: minio:9000
      AGENT_RUNTIME_MODE: "${AGENT_TEST_RUNTIME_MODE:-langgraph_fake}"
      AGENT_CONFIG_MODE: database
      AGENT_GATEWAY_PUBLIC_KEY_FILE: /run/keys/gateway-public.pem
      AGENT_SSE_HEARTBEAT_SECONDS: 1
      AGENT_CREDENTIAL_KEYRING_FILE: /run/keys/model-keyring.json
      AGENT_PROVIDER_ALLOWED_ORIGINS: '["http://mock-provider:8001"]'
      AGENT_PROVIDER_ALLOW_PRIVATE_NETWORK: true
      AGENT_BUSINESS_TOOLS_ENABLED: true
      AGENT_AGENT_PRIVATE_KEY_FILE: /run/keys/agent-private.pem
      AGENT_PROBLEM_SERVICE_ENDPOINT: mock-business:9002
    ports:
      - "127.0.0.1:${AGENT_TEST_HTTP_PORT}:8000"
    volumes:
      - "${AGENT_TEST_KEY_DIR}/gateway-public.pem:/run/keys/gateway-public.pem:ro"
      - "${AGENT_TEST_KEY_DIR}/agent-private.pem:/run/keys/agent-private.pem:ro"
      - "${AGENT_TEST_KEY_DIR}/model-keyring.json:/run/keys/model-keyring.json:ro"
    depends_on:
      mysql:
        condition: service_healthy

  mock-provider:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "uvicorn", "mock_provider:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PYTHONPATH: /mock
    volumes:
      - ./mock_provider.py:/mock/mock_provider.py:ro
    ports:
      - "127.0.0.1:${AGENT_TEST_MOCK_PORT}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway-service:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "127.0.0.1:${AGENT_TEST_GATEWAY_PORT}:8080"
    volumes:
      - ./gateway.yaml:/app/config.yaml:ro
      - "${AGENT_TEST_KEY_DIR}/gateway-private.pem:/run/keys/gateway-private.pem:ro"
      - "${AGENT_TEST_KEY_DIR}/user-public.pem:/run/keys/user-public.pem:ro"
    depends_on:
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-business:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    entrypoint: ["python", "/mock/mock_business.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9002), timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./mock_business.py:/mock/mock_business.py:ro
      - "${AGENT_TEST_KEY_DIR}/agent-public.pem:/run/keys/agent-public.pem:ro"
